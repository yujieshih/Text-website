<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>可以放寄己想放的網址唷</title>
  <style>
    body {
      margin: 0;
      padding: 28px 20px;
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .container {
      max-width: 340px;
      width: 100%;
      animation: fadeIn 1s ease-out forwards;
    }

    .badge {
      display: inline-block;
      background-color: #f3f3f3;
      color: #666666;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 10px 0;
      letter-spacing: 0.05em;
    }

    .header p {
      font-size: 0.95rem;
      color: #666666;
      margin: 0;
      line-height: 1.6;
    }

    .steps {
      background: #fafafa;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 20px 18px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .step-item:last-child {
      margin-bottom: 0;
    }

    .step-icon {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      margin-right: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .step-text {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444444;
      padding-top: 2px;
    }

    .step-text strong {
      display: block;
      color: #222222;
      margin-bottom: 2px;
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">💡 可以放寄己想放的網址唷</div>
      <h1>這個給妳DIY呀(๑´ڡ`๑)</h1>
      <p>我可以幫妳設定 或是自己玩看看 👇</p>
    </div>

    <div class="steps">
      <div class="step-item">
        <div class="step-icon">📲</div>
        <div class="step-text">
          <strong>1. 下載免費工具</strong>
          去 App Store 搜尋下載「<b>NFC Tools</b>」（或打開 iPhone 內建的「捷徑」App）
        </div>
      </div>

      <div class="step-item">
        <div class="step-icon">🔗</div>
        <div class="step-text">
          <strong>2. 貼上喜歡的網址</strong>
          點選「寫入 (Write)」➔「新增紀錄」➔ 選「<b>URL / 網址</b>」，貼上想放的歌單、相簿或網頁
        </div>
      </div>

      <div class="step-item">
        <div class="step-icon">✨</div>
        <div class="step-text">
          <strong>3. 靠近貼紙「逼」一下</strong>
          按下寫入後，用手機背面上方鏡頭旁邊靠近貼紙，打勾就大功告成囉！
        </div>
      </div>
    </div>
  </div>

</body>
</html>
